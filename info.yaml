# Tiny Tapeout project information
project:
  title:        "256-to-8 Priority Encoder"
  author:       "Mukilan"
  discord:      ""      
  description:  "Combinational priority encoder that converts a 256-bit input to an 8-bit binary index."
  language:     "Verilog"
  clock_hz:     0       # Combinational logic

  # A 256-to-8 encoder is quite large in terms of gates; 1x1 should fit, 
  # but 1x2 might be safer if routing the 256 bits becomes congested.
  tiles: "1x1"          

  # Replace 'yourusername' with your actual GitHub username
  top_module:  "encoder_256to8"

  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs (Note: You only have 8 physical inputs available)
  ui[0]: "in[0]"
  ui[1]: "in[1]"
  ui[2]: "in[2]"
  ui[3]: "in[3]"
  ui[4]: "in[4]"
  ui[5]: "in[5]"
  ui[6]: "in[6]"
  ui[7]: "in[7]"

  # Outputs (This fits perfectly)
  uo[0]: "out[0]"
  uo[1]: "out[1]"
  uo[2]: "out[2]"
  uo[3]: "out[3]"
  uo[4]: "out[4]"
  uo[5]: "out[5]"
  uo[6]: "out[6]"
  uo[7]: "out[7]"

  # Bidirectional pins (Could be used for more inputs if needed)
  uio[0]: "in[8]"
  uio[1]: "in[9]"
  uio[2]: "in[10]"
  uio[3]: "in[11]"
  uio[4]: "in[12]"
  uio[5]: "in[13]"
  uio[6]: "in[14]"
  uio[7]: "in[15]"

# Do not change!
yaml_version: 6

